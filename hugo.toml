baseURL = "https://gouthamhusky.github.io/blogsite/"
languageCode = "en-us"
title = "goutham k"

# --- content ---
[params]
  # Rendered on the homepage inside a single <p> after `~ $ whoami`.
  # Keep it ONE paragraph — inline markdown is fine, blank lines are not.
  intro  = "I'm Goutham. Opinionated Kubernetes platforms and cloud native, professionally and compulsively — the job and the hobby stopped being different things a while ago. This is where I write about it."
  github = "https://github.com/gouthamhusky"
  linkedin = "https://www.linkedin.com/in/goutham-kanags/"

  # Rendered on the homepage inside a single <p> after `~ $ cat community.md`.
  # Keep it ONE paragraph — inline markdown is fine, blank lines are not.
  community = "Outside of the day job I organize the CNCF Austin chapter and show up to talk about this stuff out loud occasionally — details on the [community](/blogsite/community/) page."

# --- pagination (modern Hugo >= 0.128) ---
[pagination]
  pagerSize = 10

# --- markdown / code highlighting ---
[markup]
  [markup.highlight]
    style     = "github"   # light, readable
    noClasses = true        # inline styles -> no extra CSS to ship
    lineNos   = false
  [markup.goldmark.renderer]
    unsafe = true           # allow occasional raw HTML in a post

# --- taxonomy: categories drive the homepage grouping ---
[taxonomies]
  category = "categories"
  tag      = "tags"

# --- RSS on home + each section ---
[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page    = ["HTML"]
